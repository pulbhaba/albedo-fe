name: Bug report
description: Report a reproducible problem in the frontend.
title: "fix: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and its user impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser, operating system, and relevant backend details.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Attach screenshots or paste safe, relevant logs.
